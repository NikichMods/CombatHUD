name: CombatHUD Lua tests

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install offline Lua harness
        run: python -m pip install -r requirements-test.txt
      - name: Run policy and adapter tests
        run: python tools/test.py
